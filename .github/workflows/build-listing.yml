name: Build VPM Package Listing

on:
  repository_dispatch:
    types:
      - update-listing
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'→ Runs at 00:00

concurrency:
  group: build-package-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate VPM listing
        run: |
          python3 << 'PYEOF'
          import json, urllib.request
          with open("source.json") as f:
              source = json.load(f)
          package_repos = [
              "sizimityper/blinking-led-shader",
              "sizimityper/carwindow-shader",
              "sizimityper/mesh-deformer",
              "sizimityper/reflector-shader"
          ]
          packages = {}
